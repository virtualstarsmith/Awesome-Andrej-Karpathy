name: Remove entry
description: Request removal of an entry (broken link, archived repo, out of scope)
labels: ["remove"]
body:
  - type: input
    id: entry
    attributes:
      label: Entry to remove
      description: Which entry? (paste the current line from the README)
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason for removal
      description: Broken link? Archived? Out of scope? Insufficient stars?
    validations:
      required: true
